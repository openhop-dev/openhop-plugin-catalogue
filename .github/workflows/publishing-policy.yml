name: Publishing policy

# All events execute the default/main workflow, never a PR merge/head checkout.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  workflow_run:
    workflows: [Validate catalogue]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions: {}
concurrency:
  group: catalogue-publishing-policy
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'openhop-dev/openhop-plugin-catalogue' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: catalogue-policy
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.prepare.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install trusted validator dependencies
        run: python -m pip install "jsonschema==4.26.0" "packaging==26.3"
      - name: Record trusted checkout
        run: printf 'POLICY_CODE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Mint catalogue-only policy token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.OPENHOP_CATALOGUE_POLICY_APP_ID }}
          private-key: ${{ secrets.OPENHOP_CATALOGUE_POLICY_APP_PRIVATE_KEY }}
          owner: openhop-dev
          repositories: openhop-plugin-catalogue
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Replace old decisions with pending checks
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_TOKEN: ${{ steps.app.outputs.token }}
        run: python scripts/publishing_policy.py prepare

  # Separate fresh runner: NO policy App key/token or write token exists here.
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      receipts: ${{ steps.verify.outputs.receipts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install trusted validator dependencies
        run: python -m pip install "jsonschema==4.26.0" "packaging==26.3"
      - name: Record trusted checkout
        run: printf 'POLICY_CODE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify PR data and public wheel without execution
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
        run: python scripts/publishing_policy.py verify

  finalize:
    needs: [prepare, verify]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: catalogue-policy
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      certified: ${{ steps.finalize.outputs.certified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install trusted validator dependencies
        run: python -m pip install "jsonschema==4.26.0" "packaging==26.3"
      - name: Record trusted checkout
        run: printf 'POLICY_CODE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Mint catalogue-only policy token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.OPENHOP_CATALOGUE_POLICY_APP_ID }}
          private-key: ${{ secrets.OPENHOP_CATALOGUE_POLICY_APP_PRIVATE_KEY }}
          owner: openhop-dev
          repositories: openhop-plugin-catalogue
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Recheck live state and issue authoritative policy decision
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_TOKEN: ${{ steps.app.outputs.token }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
          RECEIPTS: ${{ needs.verify.outputs.receipts || '[]' }}
        run: python scripts/publishing_policy.py finalize

  auto:
    needs: [prepare, finalize]
    if: vars.CATALOGUE_POLICY_AUTOMERGE_ENABLED == 'true' && needs.finalize.outputs.certified != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: catalogue-policy
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install trusted validator dependencies
        run: python -m pip install "jsonschema==4.26.0" "packaging==26.3"
      - name: Record trusted checkout
        run: printf 'POLICY_CODE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Enable protected auto-merge for certified decisions only
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
          RECEIPTS: ${{ needs.finalize.outputs.certified }}
          CATALOGUE_POLICY_AUTOMERGE_ENABLED: ${{ vars.CATALOGUE_POLICY_AUTOMERGE_ENABLED }}
        run: python scripts/publishing_policy.py auto
