name: Validate catalogue

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: >-
          python -m pip install "jsonschema==4.26.0" "packaging==26.3"
          "pytest==9.1.1" "wheel==0.48.0"

      - name: Test catalogue validation
        run: python -m pytest -q

      - name: Validate approved catalogue and wheels
        run: python scripts/validate_catalogue.py
